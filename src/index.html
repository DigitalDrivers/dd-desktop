<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Drivers</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="Digital Drivers" class="logo" />
      <p id="status">Connecting to Digital Drivers…</p>

      <section id="check" hidden>
        <h2>System check</h2>
        <dl>
          <dt>App version</dt>
          <dd id="check-version">–</dd>
          <dt>Assetto Corsa</dt>
          <dd id="check-ac">–</dd>
          <dt>Content install</dt>
          <dd id="check-write">–</dd>
        </dl>
      </section>
    </main>
  </body>
</html>
