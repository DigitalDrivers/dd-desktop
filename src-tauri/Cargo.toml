[package]
name = "dd-desktop"
version = "0.16.3"
description = "Digital Drivers desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix is necessary to make the lib name unique so it does not conflict with the bin name
# on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dd-core = { path = "../crates/dd-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keeps the setup.exe install up to date from our GitHub releases: signed update manifests, download, installer.
tauri-plugin-updater = "2.13.1"
# Tauri's own plugin: a second start focuses the running app instead of sampling and uploading every lap twice
# and downloading cars twice.
tauri-plugin-single-instance = "2.5.2"
# Downloads the club's car packages (the garage). Both are in the build already through the updater; the
# features of reqwest (TLS) come from there too.
reqwest = { version = "0.13", default-features = false }
# reqwest is built without a crypto provider (as the updater wants it); the updater installs ring's, and so do we.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
flate2 = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Reads Steam's install path from the registry.
winreg = "0.55"
# Windows toasts for the show_toast command.
tauri-winrt-notification = "0.7"
