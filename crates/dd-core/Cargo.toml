[package]
name = "dd-core"
version = "0.1.0"
description = "Platform-independent logic of the Digital Drivers desktop app (no UI, no Tauri)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Already part of the shell: reads the join ticket and the race server's entry list.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of game files for technical scrutineering; Rust's standard library has no cryptographic hash.
sha2 = "0.10"
