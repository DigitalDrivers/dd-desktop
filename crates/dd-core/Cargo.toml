[package]
name = "dd-core"
version = "0.1.0"
description = "Platform-independent logic of the Digital Drivers desktop app (no UI, no Tauri)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Already part of the shell: reads what the hosted interface sends.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of setup files; Rust's standard library has no cryptographic hash.
sha2 = "0.10"
# Checks the signature of a club car package (minisign, Ed25519). Already in the app's build: the Tauri updater
# checks app updates with it. No dependencies of its own.
minisign-verify = "0.2"
# Parses the addresses the app window navigates to (only the platform and Steam's sign-in stay in it). Already in
# the app's build through Tauri, which hands the shell those addresses as url::Url.
url = "2"
