name: Release

# A tag v<version> (the version of tauri.conf.json) builds the signed installer and publishes it as a GitHub
# release together with latest.json, which every installed app reads at start to update itself.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release-manifest.mjs ${{ github.ref_name }}
      - run: gh release create ${{ github.ref_name }} dist/release/* --title "Digital Drivers ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
